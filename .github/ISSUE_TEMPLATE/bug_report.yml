name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Client and host helper versions (`--version`), and the agent's version.
  - type: input
    id: terminal
    attributes:
      label: Terminal and OS
      description: For example Ghostty 1.3.1 on macOS 26; host Debian 13.
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: The output of the host doctor. Remove anything private.
      render: text

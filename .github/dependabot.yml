version: 2
# Each update waits a week after its release, so a bad release is usually
# pulled before it reaches us.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      charm:
        patterns: ["charm.land/*", "github.com/charmbracelet/*"]
  - package-ecosystem: gomod
    directory: /site # the docs theme
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

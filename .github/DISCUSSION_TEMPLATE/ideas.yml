title: "Idea: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are scored in [the roadmap](../blob/main/docs/roadmap.md) by demand, impact and effort. Links to public evidence that others want the same thing help a lot.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Others who want it
      description: Links to issues, threads or posts.

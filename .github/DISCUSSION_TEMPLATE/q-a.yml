labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: Commands, and their output. Remove anything private.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The output of `version`, your terminal and the host's OS.

# Licence and copyright of every file, in the REUSE format
# (https://reuse.software). `just public-check` runs `reuse lint` on it.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Lakshya Singh Panwar and contributors"
SPDX-License-Identifier = "Apache-2.0"

# Adapted from zmx's serializeTerminalState; see the file's header and NOTICE.
[[annotations]]
path = "vt/src/snapshot.zig"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Eric Bower"
SPDX-License-Identifier = "MIT"

# Screen-rule patterns adapted from Herdr's agent detection manifests; see NOTICE.
[[annotations]]
path = "internal/agents/rules/*.toml"
precedence = "aggregate"
SPDX-FileCopyrightText = "The Herdr authors"
SPDX-License-Identifier = "Apache-2.0"

# The site's fonts, cut down from JetBrains Mono, Inter and Schibsted Grotesk
# (scripts/site-vendor.sh).
[[annotations]]
path = "site/public/fonts/mono.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "site/public/fonts/sans.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "site/public/fonts/display.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2023 The Schibsted-Grotesk Project Authors"
SPDX-License-Identifier = "OFL-1.1"
